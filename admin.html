<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stock manager — Curiosity Fox</title>
  <link rel="icon" href="assets/fox.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .admin { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .admin h1 { font-size: 2.25rem; }
    .admin h2 { font-size: 1.6rem; margin-top: 2.5rem; }
    .panel { background: var(--paper-2); border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); border-radius: 8px; padding: 1.25rem; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .fields label { display: flex; flex-direction: column; gap: .35rem; font-weight: 500; font-size: .95rem; }
    .fields .full { grid-column: 1 / -1; }
    .fields input:not([type=checkbox]), .fields select, .fields textarea { font: inherit; padding: .65rem .75rem; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 6px; background: #fff; color: var(--ink); }
    .fields .check { flex-direction: row; align-items: center; gap: .5rem; }
    .fields .check input { width: 1.2rem; height: 1.2rem; accent-color: var(--moss); }
    .hint { font-size: .85rem; font-weight: 400; color: color-mix(in srgb, var(--ink) 70%, transparent); }
    .photo-drop { display: grid; place-items: center; min-height: 180px; border: 2px dashed color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 8px; background: #fff; cursor: pointer; text-align: center; padding: 1rem; }
    .photo-drop img { max-height: 260px; width: auto; }
    .photo-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; align-items: center; }
    .status { min-height: 1.5em; margin: .75rem 0 0; font-weight: 500; }
    .status.is-error { color: #a3260b; }
    .status.is-ok { color: var(--moss); }
    .stock { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    .stock li { display: grid; grid-template-columns: 64px 1fr; gap: .9rem; align-items: center; background: var(--paper-2); border-radius: 8px; padding: .75rem; }
    .stock img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; background: var(--paper); }
    .stock-name { font-family: var(--display); font-size: 1.25rem; line-height: 1.2; }
    .stock-meta { font-size: .9rem; }
    .stock-meta .sold { color: var(--fox-dark); font-weight: 700; }
    .stock-btns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .5rem; }
    .small { padding: .4rem .9rem; font-size: .9rem; border-width: 1px; }
    .danger { border-color: #a3260b; color: #a3260b; background: transparent; }
    .danger:hover { background: #a3260b; color: #fff; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="admin">
    <div class="topbar">
      <a class="brand" href="./"><img src="assets/fox.svg" alt="" width="32" height="32"><span>Curiosity Fox</span></a>
      <button class="btn btn-ghost small" id="disconnect" hidden>Disconnect this device</button>
    </div>
    <h1>Stock manager</h1>

    <!-- Step 1: connect to GitHub (once per device) -->
    <section id="connect" class="panel" hidden>
      <p>Connect this device to the shop's GitHub repository. You only need to do this once on each phone or computer. See the README for how to create the access token.</p>
      <form id="connect-form" class="fields">
        <label>GitHub username<input name="owner" required autocapitalize="none" autocomplete="off"></label>
        <label>Repository name<input name="repo" required autocapitalize="none" autocomplete="off" placeholder="curiosity-fox"></label>
        <label>Branch<input name="branch" required value="main" autocapitalize="none"></label>
        <label class="full">Access token<input name="token" type="password" required autocomplete="off" placeholder="github_pat_…"></label>
        <div class="full actions"><button class="btn btn-primary" type="submit">Connect</button></div>
      </form>
      <p class="status" id="connect-status" role="status"></p>
    </section>

    <!-- Step 2: add / edit stock -->
    <div id="manager" hidden>
      <section class="panel">
        <h2 id="form-title" style="margin-top:0">Add a new piece</h2>
        <form id="item-form" class="fields" novalidate>
          <label class="full photo-drop" id="photo-drop">
            <span id="photo-placeholder">Tap to add a photo<br><span class="hint">JPG, PNG or HEIC from your camera. It's resized automatically.</span></span>
            <img id="photo-preview" alt="" hidden>
            <input type="file" id="photo" accept="image/*">
          </label>
          <label class="full">Name<input name="name" required maxlength="80"></label>
          <label>Type
            <select name="kind" required>
              <option value="painting">Painting</option>
              <option value="diorama">Diorama</option>
              <option value="curiosity">Curiosity</option>
            </select>
          </label>
          <label>Price (£)<input name="price" type="number" inputmode="decimal" min="0" step="1" required></label>
          <label class="full">Description<textarea name="description" rows="4" required></textarea></label>
          <label class="full">Details <span class="hint">One per line, e.g. Size: 30 × 40 cm</span><textarea name="specs" rows="3" placeholder="Size: 30 × 40 cm&#10;Medium: Acrylic on board"></textarea></label>
          <label class="full">Payment link <span class="hint">Optional. A Stripe Payment Link or Etsy listing. Leave empty for "Enquire to buy".</span><input name="buyUrl" type="url" inputmode="url" placeholder="https://buy.stripe.com/…"></label>
          <label class="check"><input type="checkbox" name="featured"> Show on the shelf at the top</label>
          <label class="check"><input type="checkbox" name="sold"> Sold</label>
        </form>
        <div class="actions">
          <button class="btn btn-primary" id="save" type="button">Add to shop</button>
          <button class="btn btn-ghost" id="cancel-edit" type="button" hidden>Cancel editing</button>
        </div>
        <p class="status" id="save-status" role="status"></p>
      </section>

      <h2>In the cabinet</h2>
      <p class="hint">Changes appear on the live site about a minute after saving.</p>
      <ul class="stock" id="stock"></ul>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
